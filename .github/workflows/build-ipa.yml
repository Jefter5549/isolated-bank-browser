name: Build Isolated Browser IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen openssl@3

      - name: TLS Security Regression Tests
        run: OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl" bash scripts/test-tls.sh

      - name: Browser Preferences Regression Tests
        run: bash scripts/test-browser.sh

      - name: WebKit Cleartext Blocking Tests
        run: bash scripts/test-web-content.sh

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project IsolatedBrowser.xcodeproj \
            -scheme IsolatedBrowser \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/IsolatedBrowser.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/IsolatedBrowser.xcarchive/Products/Applications/IsolatedBrowser.app Payload/
          zip -r -q IsolatedBrowser.ipa Payload
          echo "IPA Size: $(du -h IsolatedBrowser.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsolatedBrowser-unsigned-ipa
          path: IsolatedBrowser.ipa
          retention-days: 30
