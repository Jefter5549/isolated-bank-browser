name: IsolatedBrowser
options:
  bundleIdPrefix: space.jefter
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: '15.0'

targets:
  IsolatedBrowser:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: IsolatedBrowser/Sources
    settings:
      base:
        PRODUCT_NAME: IsolatedBrowser
        PRODUCT_BUNDLE_IDENTIFIER: space.jefter.isolatedbrowser
        INFOPLIST_FILE: IsolatedBrowser/Sources/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
